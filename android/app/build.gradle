plugins { id 'com.android.application' }

dependencies { implementation 'androidx.webkit:webkit:1.12.1' }

android {
    namespace 'org.strongholdprotocol.nativeclient'
    compileSdk 35

    defaultConfig {
        applicationId 'org.strongholdprotocol.nativeclient'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.3.0'
    }

    sourceSets { main.assets.srcDir(layout.buildDirectory.dir('generated/nativeWeb')) }

    def generatedWeb = layout.buildDirectory.dir('generated/nativeWeb')

    // A packaged APK carries the official art `data/assets.json` lists, so a build without it
    // fails here instead of installing a client whose images 404. The check mirrors
    // tools/check-embedded-assets.mjs, which the Windows build runs from src-tauri/build.rs.
    tasks.register('checkEmbeddedAssets') {
        def manifest = file('../../data/assets.json')
        def webRoot = file('../../public')
        inputs.files(manifest)
        outputs.upToDateWhen { false }
        doLast {
            if (!manifest.isFile()) {
                throw new GradleException('embedded assets: data/assets.json is missing')
            }
            def urls = []
            (manifest.getText('UTF-8') =~ /"\/(?:assets|fonts)\/[^"]+"/).each { urls << it.substring(1, it.length() - 1) }
            urls = urls.unique()
            if (urls.isEmpty()) {
                throw new GradleException('embedded assets: data/assets.json lists no /assets/ URL')
            }
            def missing = urls.findAll { url -> !new File(webRoot, url.substring(1)).isFile() }
            if (missing) {
                throw new GradleException("embedded assets: ${missing.size()} of ${urls.size()} manifest files are missing " +
                    "(e.g. ${missing.take(3).join(', ')}); run `npm run assets`")
            }
        }
    }

    tasks.register('syncNativeWeb', Copy) {
        dependsOn(tasks.named('checkEmbeddedAssets'))
        from('../../public')
        into(generatedWeb)
        from('../../data') { into('data') }
        from('../../shared') { into('shared') }
        from('../../server/sim') { into('sim'); exclude('nodeData.js') }
        from('../../native/web/data.js') { rename { 'data.js' } }
        from('../../native/bridge/stronghold-native-bridge.js') { into('native'); rename { 'bridge.js' } }
    }

    // The R2 endpoint never ships in the page source: the build writes the runtime asset
    // configuration next to the packaged web root, exactly like the Windows client does.
    tasks.register('writeAssetConfig') {
        mustRunAfter(tasks.named('syncNativeWeb'))
        def indexUrl = project.findProperty('SP_ASSET_INDEX_URL')
        def tokenUrl = project.findProperty('SP_ASSET_TOKEN_URL')
        inputs.property('indexUrl', indexUrl ?: '')
        inputs.property('tokenUrl', tokenUrl ?: '')
        outputs.file(layout.buildDirectory.file('generated/nativeWeb/asset-config.json'))
        doLast {
            def target = new File(generatedWeb.get().asFile, 'asset-config.json')
            if (!indexUrl) {
                target.delete()
                return
            }
            def config = [
                format  : 'sp-assets-config-v1',
                enabled : true,
                indexUrl: indexUrl,
                tokenUrl: tokenUrl ?: '',
                maxChain: 3,
                allowHttp: false,
            ]
            target.text = groovy.json.JsonOutput.toJson(config)
        }
    }
    preBuild.dependsOn(tasks.named('syncNativeWeb'), tasks.named('writeAssetConfig'))
}
