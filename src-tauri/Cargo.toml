[package]
name = "stronghold-protocol-client"
version = "2.6.4"
description = "Stronghold Protocol Enhanced Windows desktop client"
authors = ["zasx77771"]
edition = "2021"
rust-version = "1.77"
license = "SEE LICENSE IN LICENSE"
publish = false
# The version above must equal package.json, tauri.conf.json and desktop/runtime/package.json.
# tools/release-policy.mjs still reads the last of those; the recommendation is to move that check
# onto tauri.conf.json once a writer owns that file.

[lib]
name = "stronghold_protocol_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# `url` is pulled in by reqwest anyway; depending on it directly keeps asset.rs honest about the
# origin comparison that pins every R2 redirect to one origin.
url = "2"
# reqwest and tokio are already in the Tauri dependency graph; naming them makes the R2 asset client
# explicit. rustls keeps the Windows build free of an OpenSSL/System32 TLS surprise.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
hex = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
